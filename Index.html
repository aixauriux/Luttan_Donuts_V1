<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luttan Donuts</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            background: linear-gradient(135deg, #fff0f6, #ffe4ec);

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .contenedor {
            background-color: white;

            width: 90%;
            max-width: 850px;

            padding: 50px;

            border-radius: 25px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;

            object-fit: contain;

            margin-bottom: 20px;
        }

        h1 {
            color: #d63384;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .descripcion {
            color: #666;

            margin-bottom: 35px;
        }

        .opciones {
            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;
        }

        .opcion {
            width: 280px;

            padding: 30px;

            border-radius: 20px;

            border: 2px solid #f8d7e5;

            background-color: #fff8fb;
        }

        .opcion h2 {
            color: #d63384;

            margin-bottom: 15px;
        }

        .opcion p {
            color: #666;

            min-height: 70px;
        }

        .btn-luttan {
            background-color: #d63384;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 25px;

            text-decoration: none;

            display: inline-block;

            margin-top: 10px;

            transition: 0.3s;
        }

        .btn-luttan:hover {
            background-color: #b52b70;

            color: white;

            transform: scale(1.05);
        }

    </style>

</head>


<body>

    <div class="contenedor">

       
        <img src="Empleado/img/luttan.jpeg"
             alt="Logo Luttan Donuts"
             class="logo">


        
        <h1>🍩 Luttan Donuts</h1>

        <p class="descripcion">
            Bienvenido a Luttan Donuts.
            Selecciona cómo quieres ingresar.
        </p>


        <div class="opciones">


            <div class="opcion">

                <h2>🛍️ Cliente</h2>

                <p>
                    Explora nuestros productos,
                    consulta el catálogo y realiza
                    tu pedido.
                </p>

                <!--
                    IMPORTANTE:
                    Index.html está dentro de maquetacion.
                    Cliente también está dentro de maquetacion.
                    Por eso NO se escribe maquetacion/ aquí.
                -->

                <a href="Cliente/Inicio.html"
                   class="btn-luttan">

                    Ingresar como cliente

                </a>

            </div>


      

            <div class="opcion">

                <h2>👩‍💼 Empleado</h2>

                <p>
                    Ingresa al sistema para gestionar
                    ventas, clientes, inventario y caja.
                </p>

               
                <a href="Empleado/InicioSesion.html"
                   class="btn-luttan">

                    Ingresar como empleado

                </a>

            </div>


        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
